<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #09090b 0%, #1a1a2e 50%, #0f1f1a 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: white;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(205,255,0,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -150px;
    left: -50px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .container {
    display: flex;
    align-items: center;
    padding: 0 80px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .left {
    flex: 1;
  }
  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(205,255,0,0.1);
    border: 1px solid rgba(205,255,0,0.3);
    padding: 8px 16px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .logo-badge .dumbbell {
    font-size: 20px;
  }
  .logo-badge span {
    color: #CDFF00;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 16px;
    letter-spacing: -1px;
  }
  h1 .highlight {
    color: #CDFF00;
  }
  .tagline {
    font-size: 24px;
    color: #a1a1aa;
    font-weight: 500;
    margin-bottom: 24px;
    max-width: 520px;
  }
  .features {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .feature-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    color: #d4d4d8;
    font-weight: 600;
  }
  .right {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .phone-icon {
    width: 180px;
    height: 180px;
    background: linear-gradient(135deg, #CDFF00 0%, #10b981 100%);
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(205,255,0,0.3);
  }
  .phone-icon svg {
    width: 100px;
    height: 100px;
    stroke: #09090b;
    stroke-width: 2.5;
    fill: none;
  }
  .trainer-name {
    font-size: 14px;
    color: #a1a1aa;
    font-weight: 500;
  }
  .trainer-name strong {
    color: white;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-badge">
        <span class="dumbbell">🏋️</span>
        <span>GYMRAT</span>
      </div>
      <h1>Tu entrenador <span class="highlight">personal</span><br>en el bolsillo.</h1>
      <p class="tagline">Planes de entrenamiento y nutrición 100% personalizados.</p>
      <div class="features">
        <div class="feature-chip">✓ Plan a medida</div>
        <div class="feature-chip">✓ Chat directo</div>
        <div class="feature-chip">✓ Seguimiento diario</div>
        <div class="feature-chip">✓ Videos de técnica</div>
      </div>
    </div>
    <div class="right">
      <div class="phone-icon">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 6.5h11v11h-11z" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 9l-3-1.5v9L6.5 15M17.5 9l3-1.5v9L17.5 15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="trainer-name">con <strong>Pablo Scarlatto</strong><br>Campeón 2019</p>
    </div>
  </div>
</body>
</html>
